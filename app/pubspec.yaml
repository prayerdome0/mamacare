name: mamacare
description: MAMA CARE — offline-first maternal health app for health workers.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend (auth, REST, realtime)
  supabase_flutter: ^2.5.0

  # Offline storage
  sqflite: ^2.3.3
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
